<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Variables Example</title>

<style>
body{
    font-family: Arial;
    padding: 20px;
    background-color: rgb(157, 65, 244);
}

/* First div */
.text-box{
    font-size: 20px;
    margin-bottom: 20px;
}

/* Memory text */
.memory{
    font-weight: bold;
    margin-bottom: 5px;
}

/* Purple container */
.purple-box{
    background-color: purple;
    padding: 20px;
    width: 400px;
}

/* Radius text */
.radius{
    color: white;
    margin-bottom: 10px;
}

/* Three white divs */
.white-container{
    display: flex;
    gap: 10px;
}

.white-box{
    background-color: white;
    height: 60px;
    width: 80px;
    border-radius: 5px;
}
</style>

</head>

<body>
<h1>Varables In JavaScript </h1>
<div class="text-box">
Variables are Containers for data
</div>

<div class="memory">Memory</div>

<div class="purple-box">

<div class="radius">Radius</div>

<div class="white-container">
    <div class="white-box">14</div>
    <div class="white-box"></div>
    <div class="white-box"></div>
</div>

</div>

</body>
<script src="VarContMemLo.js"></script>
</html>
