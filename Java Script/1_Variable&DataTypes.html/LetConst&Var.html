<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>let, const & var</title>
    <style>
*{
    background-color: #f5a394;
}
.js-variables{
    background: linear-gradient(135deg,#ff7e5f,#feb47b);
    padding: 30px;
    width: 550px;
    margin: 40px auto;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.js-variables h1{
    text-align: center;
    color: white;
    margin-bottom: 20px;
}

.js-variables ul{
    list-style: none;
    padding: 0;
}

.js-variables li{
    background: white;
    margin: 12px 0;
    padding: 15px;
    border-radius: 8px;
    font-size: 16px;
    line-height: 1.5;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

.keyword{
    font-weight: bold;
    color: #ff4b2b;
}

</style>

</head>
<body>
    <div class="js-variables">

<h1>let, const & var</h1>

<ul>
<li><span class="keyword">var :</span> Variable can be re-declared & updated. It is a global scope variable.</li>

<li><span class="keyword">let :</span> Variable cannot be re-declared but can be updated. It is a block scope variable.</li>

<li><span class="keyword">const :</span> Variable cannot be re-declared or updated. It is a block scope variable.</li>
</ul>

</div>

</body>
<script src="LetConst&Var.js"></script>
</html>
