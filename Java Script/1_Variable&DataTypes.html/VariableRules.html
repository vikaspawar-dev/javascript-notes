<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable Rules</title>
    <style>
        *{
            background-color: #34496c;
        }
        .variable-rules {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            padding: 30px;
            width: 500px;
            margin: 40px auto;
            border-radius: 12px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.3);
        }

        .variable-rules h1 {
            text-align: center;
            color: white;
            background: none;
            margin-bottom: 20px;
        }

        .variable-rules ul {
            list-style: none;
            padding: 0;
        }

        .variable-rules li {
            background: white;
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .variable-rules li:hover {
            transform: translateX(8px);
            background: #f2f2f2;
        }
    </style>
    
</head>

<body>
    <section>
        <div class="variable-rules">

            <h1>Variable Rules</h1>

            <ul>
                <li>Variable names are case sensitive.</li>
                <li>"a" & "A" are different.</li>
                <li>Only letters, digits, underscore (_) and $ are allowed (space not allowed).</li>
                <li>Only a letter, underscore (_) or $ should be the first character.</li>
                <li>Reserved words cannot be variable names.</li>
            </ul>

        </div>
        </ul>
    </section>
</body>
<script src="VariableRules.js"></script>
</html>
