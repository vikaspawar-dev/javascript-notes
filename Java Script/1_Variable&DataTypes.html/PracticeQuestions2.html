<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Questions 2</title>
    <style>
        body{
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Card Design */
.card{
    background-color:white;
    width:450px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

/* Heading */
.card h1{
    background-color:#ff6b35;
    color:white;
    padding:10px;
    border-radius:6px;
    margin-bottom:20px;
}

/* Paragraph */
.card p{
    font-size:18px;
    color:#333;
    line-height:1.5;
}
    </style>
</head>
<body>
    <div class="card">

    <h1>Let's Practice Questions</h1>

    <p>
        <strong>Question 2:</strong> Create a <strong>const object</strong> called 
        <strong>"profile"</strong> to store the information shown in the picture.
    </p>

</div>
</body>

</html>
