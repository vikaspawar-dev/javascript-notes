<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Data Types</title>
    <Style>
        body{
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Main Box */
.container{
    background-color:white;
    padding:30px 50px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* Heading */
h1{
    text-align:center;
    color:white;
    background-color:#ff6b35;
    padding:12px;
    border-radius:6px;
    margin-bottom:20px;
}

/* List */
ul{
    font-size:18px;
}

ul li{
    margin:8px 0;
}

ul li ul{
    margin-top:10px;
}

ul li ul li{
    color:#333;
}
    </Style>
</head>
<body>

<div class="container">

<h1>Data Types in JavaScript</h1>

<ul>
    <li><strong>Primitive Types</strong>
        <ul>
            <li>Number</li>
            <li>String</li>
            <li>Boolean</li>
            <li>Undefined</li>
            <li>Null</li>
            <li>BigInt</li>
            <li>Symbol</li>
        </ul>
    </li>
</ul>

</div>

</body>
<script src="DataTypes .js"></script>
</html>
